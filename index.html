.video-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:6px;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.5) 0%,transparent 60%,rgba(0,0,0,.3) 100%)}

.badge-live{background:#ef4444;color:#fff}
.badge-quality{background:rgba(255,255,255,.1);color:#fff}
.channels-section{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px}
.channels{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.ch{display:flex;flex-direction:column;gap:2px;padding:4px;background:#14121a;border:1px solid #333;align-items:stretch;text-align:center;border-left:3px solid #ef4444}
.ch-name{font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:normal;word-break:break-word;line-height:1.2}
.btn{background:#ef4444;color:#fff;border:none;padding:4px 6px;font-size:8px;font-weight:bold;cursor:pointer;width:100%;flex-shrink:0}
.btn:active{background:#d63838;opacity:.9}
footer{text-align:center;padding:6px;font-size:8px;color:#666;border-top:1px solid #333;flex-shrink:0}

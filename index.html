html,body{height:100%;overflow:hidden}

.badge-live{background:#ef4444;color:#fff}
.badge-quality{background:rgba(255,255,255,.1);color:#fff}

}

}
.btn:active,.btn:focus{
outline:2px solid #86efac;
outline-offset:-2px;
}

.btn:active,.btn:focus{background:#ef4444;opacity:1;outline:none}
footer{text-align:center;padding:6px;font-size:8px;color:#666;border-top:1px solid #333;flex-shrink:0}

var v=document.getElementById('player'),
    h=null,
    title=document.getElementById('videoTitle'),
    cGrid=document.getElementById('channels'),
    selectedButton=null;

function clearSelected(){
  if(selectedButton){
    selectedButton.classList.remove('selected');
  }
}

function selectButton(b){
  clearSelected();
  selectedButton=b;
  if(b) b.classList.add('selected');
}

function stopHls(){
  if(h){
    try{h.destroy();}catch(e){}
    h=null;
  }
}

function play(b){
  var n=b.getAttribute('data-name'),
      u=b.getAttribute('data-stream');

  if(!u)return;

  selectButton(b);
  title.textContent=n;
  stopHls();

  // Prefer hls.js on browsers that support it.
  if(typeof Hls!=='undefined' && Hls.isSupported()){
    h=new Hls({
      enableWorker:false,
      lowLatencyMode:false,
      maxBufferLength:5,
      maxMaxBufferLength:8,
      liveSyncDurationCount:3,
      fragLoadingTimeOut:10000,
      manifestLoadingTimeOut:10000,
      levelLoadingTimeOut:10000
    });

    h.attachMedia(v);

    h.on(Hls.Events.MEDIA_ATTACHED,function(){
      h.loadSource(u);
    });

    h.on(Hls.Events.MANIFEST_PARSED,function(){
      var p=v.play();
      if(p&&p.catch)p.catch(function(){});
    });

    h.on(Hls.Events.ERROR,function(event,data){
      if(!data || !data.fatal)return;

      if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
        try{h.recoverMediaError();}catch(e){}
      }else if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
        try{h.startLoad();}catch(e){}
      }
    });

  }else{
    // Native HLS fallback for browsers that provide it.
    v.src=u;
    v.load();
    var p=v.play();
    if(p&&p.catch)p.catch(function(){});
  }
}

// Generate the channel buttons.
channels.forEach(function(ch){
  var div=document.createElement('div');
  div.className='ch';

  var name=document.createElement('span');
  name.className='ch-name';
  name.textContent=ch[0];

  var btn=document.createElement('button');
  btn.className='btn';
  btn.type='button';
  btn.textContent='PLAY';
  btn.setAttribute('data-name',ch[0]);
  btn.setAttribute('data-stream',ch[1]);
  btn.onclick=function(){
    play(this);
  };

  div.appendChild(name);
  div.appendChild(btn);
  cGrid.appendChild(div);
});

// Do not automatically open a channel.
title.textContent='Select Channel';

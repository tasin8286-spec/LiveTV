<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rangdhonu Tv - Lite</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
/* ========== FEATURE PHONE OPTIMIZED THEME ========== */
body {
    background: #000000;
    color: #ffffff;
    font-family: sans-serif;
    margin: 0;
    padding: 0;
}

/* Clear D-Pad Focus State */
a:focus, button:focus, [tabindex]:focus, input:focus {
    outline: 3px solid #ffcc00 !important;
    background-color: #333333 !important;
}

/* Basic Header */
.header {
    background: #111111;
    padding: 10px;
    text-align: center;
    border-bottom: 2px solid #333;
}
.logo {
    font-size: 18px;
    font-weight: bold;
    color: #a78bfa;
    text-decoration: none;
}
.nav-menu {
    margin-top: 5px;
    display: flex;
    justify-content: center;
    gap: 10px;
}
.nav-menu a {
    color: #b8b0d0;
    font-size: 12px;
    text-decoration: none;
    padding: 5px;
}

/* Video Section */
.video-wrapper {
    width: 100%;
    background: #111;
    border-bottom: 2px solid #333;
}
video {
    width: 100%;
    max-height: 240px;
    background: #000;
    display: block;
}
.now-playing {
    padding: 8px;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    background: #222;
}

/* Categories */
.chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 10px;
    background: #000;
}
.chip {
    padding: 6px 12px;
    background: #222;
    border: 1px solid #444;
    color: #ccc;
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
}
.chip.active {
    background: #8b5cf6;
    color: #fff;
    border-color: #8b5cf6;
}

/* Channel List (Vertical for small screens) */
.channel-grid {
    display: block;
    padding: 0;
    margin: 0;
}
.channel-card {
    display: flex;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #222;
    cursor: pointer;
}
.channel-card.active-card {
    background: #1a1a2e;
    border-left: 4px solid #8b5cf6;
}
.card-thumb {
    width: 50px;
    height: 50px;
    background: #111;
    margin-right: 12px;
    flex-shrink: 0;
}
.card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.card-body h4 {
    margin: 0 0 4px 0;
    font-size: 14px;
    color: #fff;
}
.category {
    font-size: 11px;
    color: #888;
}

/* Hide unsupported/heavy elements */
.video-overlay, .nav-btn, .search-overlay, .telegram-float, #rdGate, #premiumAdOverlay {
    display: none !important;
}
</style>
</head>
<body>

<header class="header">
    <a class="logo" tabindex="0" href="#">Rangdhonu Lite</a>
    <nav class="nav-menu">
        <a tabindex="0" href="#" onclick="alert('Home')">Home</a>
        <a tabindex="0" href="#" onclick="alert('About: Premium IPTV')">About</a>
    </nav>
</header>

<div class="video-wrapper">
    <video controls id="livePlayer" poster="https://via.placeholder.com/320x240/12121a/8b5cf6?text=Play"></video>
    <div class="now-playing" id="videoTitle">Select a Channel</div>
</div>

<div class="chips" id="categoryChips">
    <div class="chip active" tabindex="0" data-category="all" onclick="filterChannels('all', this)">All</div>
    <div class="chip" tabindex="0" data-category="sports" onclick="filterChannels('sports', this)">Sports</div>
    <div class="chip" tabindex="0" data-category="news" onclick="filterChannels('news', this)">News</div>
    <div class="chip" tabindex="0" data-category="entertainment" onclick="filterChannels('entertainment', this)">Entertainment</div>
</div>

<div class="channel-grid" id="channelGrid">
    <!-- BTV -->
    <div class="channel-card" tabindex="0" data-category="news" data-channel="BTV" data-stream="https://rangdhonu-proxy.tasinazad2009.workers.dev/stream/btv1/playlist.m3u8?expires=1787033025&sig=aocSLUL3SXmSzu2jDEuJK7t15VY6g41fA8k_DJrGOB8" data-title="BTV" onclick="loadChannel(this)">
        <div class="card-thumb"><img alt="BTV" src="https://via.placeholder.com/50"></div>
        <div class="card-body">
            <h4>BTV</h4>
            <div class="category">News</div>
        </div>
    </div>
    
    <!-- T Sports -->
    <div class="channel-card" tabindex="0" data-category="sports" data-channel="T Sports" data-stream="https://rangdhonu-proxy.tasinazad2009.workers.dev/stream/tsports/playlist.m3u8?expires=1787014631&sig=MwVdxeaOX-QIdVi1FkpTvOvvPIWTXscqsZl0kfEloa0" data-title="T Sports" onclick="loadChannel(this)">
        <div class="card-thumb"><img alt="T Sports" src="https://via.placeholder.com/50"></div>
        <div class="card-body">
            <h4>T Sports</h4>
            <div class="category">Sports</div>
        </div>
    </div>

    <!-- Zee Bangla -->
    <div class="channel-card" tabindex="0" data-category="entertainment" data-channel="Zee Bangla" data-stream="https://rangdhonu-proxy.tasinazad2009.workers.dev/stream/zeebangla1/playlist.m3u8?expires=1787005551&sig=_eXGpoA9avykSr0_-xDvGZ5llRpwXt-e9Ug1r0rNjfM" data-title="Zee Bangla" onclick="loadChannel(this)">
        <div class="card-thumb"><img alt="Zee Bangla" src="https://via.placeholder.com/50"></div>
        <div class="card-body">
            <h4>Zee Bangla</h4>
            <div class="category">Entertainment</div>
        </div>
    </div>
    
    <!-- Note: You can paste the rest of your channel <div> blocks here. Just ensure you add tabindex="0" to each .channel-card so the D-pad can select them. -->
</div>

<script>
    var video = document.getElementById('livePlayer');
    var hls = null;

    // Feature Phone D-PAD Support: Trigger click on Enter key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            if (document.activeElement && document.activeElement.hasAttribute('tabindex')) {
                document.activeElement.click();
            }
        }
    });

    function loadChannel(element) {
        var stream = element.getAttribute('data-stream');
        var title = element.getAttribute('data-title');
        
        if (stream && stream !== '#') {
            document.getElementById('videoTitle').textContent = title + " - Loading...";
            
            // Remove active class from all, add to current
            document.querySelectorAll('.channel-card').forEach(function(c) { c.classList.remove('active-card'); });
            element.classList.add('active-card');

            if (Hls.isSupported()) {
                if (hls) { hls.destroy(); }
                hls = new Hls({ enableWorker: false }); // Disable worker for lower RAM usage on feature phones
                hls.loadSource(stream);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    document.getElementById('videoTitle').textContent = title + " (Playing)";
                    video.play().catch(function(e){ console.log(e); });
                    video.focus(); // Focus video player so D-pad can control volume/play
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = stream;
                document.getElementById('videoTitle').textContent = title + " (Playing)";
                video.play();
                video.focus();
            } else {
                alert("Streaming not supported on this browser.");
            }
        }
    }

    function filterChannels(category, element) {
        // Update active chip
        document.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
        element.classList.add('active');

        // Filter list
        var cards = document.querySelectorAll('.channel-card');
        cards.forEach(function(card) {
            if (category === 'all' || card.getAttribute('data-category') === category) {
                card.style.display = 'flex';
            } else {
                card.style.display = 'none';
            }
        });
    }
</script>
</body>
</html>
